# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing
# --- Your Startup Applications ---

exec-once = awww-daemon
exec-once = awww restore
exec-once = quickshell
#exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = sleep 1 && hyprctl dispatch global quickshell:lock

exec-once = systemctl --user start hyprpolkitagent



# Your startup apps
#exec-once = sleep 3 && vesktop --start-minimized
exec-once = sleep 3 && spotify --start-minimized
exec-once = sleep 3 && steam -silent
exec-once = sleep 3 && zapzap --silent
exec-once = sleep 10 && protonvpn-app

#Autoload input-remapper configs
exec-once = sleep 3 && input-remapper-control --command autoload

#Custom audio setup
#exec-once = sleep 3 && /bin/bash /home/larke/.config/pipewire/pw-loadwires /home/larke/.config/pipewire/my-links.conf


#reload hyprland plugins
exec-once = sleep 3 && hyprpm reload -n



# Force the system to recognize dark mode
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-sapphire-standard+default'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Sync these settings to the portals/polkit
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

