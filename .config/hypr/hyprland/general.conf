#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input

# Mouse, Keyboard, and Gaps
input {
    accel_profile = flat
    sensitivity = -0.83
    kb_layout = br
    kb_variant = abnt2

    scroll_factor = 1
}

binds {
    scroll_event_delay = 100
}

general {
    gaps_in = 1
    gaps_out = 5
    resize_on_border = false
}

cursor {
    no_hardware_cursors = false
}






#Forces PSIM to tile
windowrule = tile on, match:class ^(psim.exe)$
windowrule = tile on, match:class ^(simview.exe)$


# Force Minecraft to always tile
windowrule = tile on, match:class ^(Minecraft.*)$, match:title ^(Minecraft*)$

# Force Steam to always tile
windowrule = match:class ^(steam)$, tile on

#Makes wayland never sleep FFXIV
windowrule = render_unfocused on, match:class ^(ffxiv_dx11.exe)$


animations {
    #enabled = yes

    # Syntax: animation = NAME, ON/OFF, SPEED, CURVE, STYLE

    # OPTION 1: Slide in from the top (Classic "Console" feel)
    #animation = specialWorkspace, 1, 6, default, slidevert

    # OPTION 2: Fade in (Subtle)
    # animation = specialWorkspace, 1, 6, default, fade

    # OPTION 3: Scale/Zoom (Pop up effect)
    # animation = specialWorkspace, 1, 6, default, scale
}
#Default blur
decoration {
    blur {
        enabled = yes
        size = 5
        passes = 2
        ignore_opacity = true

        noise = 0.08
        contrast = 1.5
        brightness = 0.8

        xray = false
        new_optimizations = true
    }
}




###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus --new-window
$menu = hyprlauncher
$browser = zen-browser




misc {
    # If this is off, special workspaces might linger
    always_follow_on_dnd = true
    enable_swallow = true
}

env = HYPRCURSOR_THEME,Ado
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,Ado
env = XCURSOR_SIZE,32

exec-once = hyprctl setcursor Ado 32
