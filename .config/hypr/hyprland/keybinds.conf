###################
### KEYBINDINGS ###
###################

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && touch /tmp/qs-vol-trigger
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && touch /tmp/qs-vol-trigger
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && touch /tmp/qs-vol-trigger


# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


# Move window with mainMod + alt + arrow keys
bind = SUPER_ALT, left, movewindow, l
bind = SUPER_ALT, right, movewindow, r 
bind = SUPER_ALT, up, movewindow, u
bind = SUPER_ALT, down, movewindow, d



# Move window with mainMod + alt + arrow keys
bind = SUPER_SHIFT, left, resizeactive, -25 0
bind = SUPER_SHIFT, right, resizeactive, 25 0 
bind = SUPER_SHIFT, up, resizeactive, 0 -25
bind = SUPER_SHIFT, down, resizeactive, 0 25

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


unbind = $mainMod, T
bind = $mainMod, T, exec, $terminal
unbind = $mainMod, Q
bind = $mainMod, Q, exec, ~/.config/hypr/GameWorkspace/scripts/close-window.sh
bindr = $mainMod, $mainMod_L, exec, $menu
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $fileManager




# --- Custom Lock Screen Bind ---
# Unbind any default (just in case) and bind the correct Quickshell lock command
unbind = $mainMod, L
#bind = $mainMod, L, exec, hyprctl dispatch global quickshell:lock
bind = $mainMod, L, exec, hyprlock
# SUPER + F (Toggle Float)
unbind = SUPER_ALT, F
bind = SUPER_ALT, F, togglefloating

unbind = SUPER, F
bind = SUPER, F, fullscreen, 1

# $mainMod + SHIFT + F (Toggle Fullscreen)
unbind = SUPER_SHIFT, F
bind = SUPER_SHIFT, F, fullscreen, 0


# --- My Special Workspace Keybinds ---


# $mainMod + P  (Whatsapp/Telegram)
unbind = $mainMod, P
bind = $mainMod, P, togglespecialworkspace, Whatsapp

# SUPER + D  (Discord)
unbind = $mainMod, D
bind = $mainMod, D, togglespecialworkspace, discord


# SUPER + S  (Spotify)
unbind = $mainMod, S
bind = $mainMod, S,togglespecialworkspace, spotify


# SUPER + M  (Spotify)
unbind = $mainMod, M 
bind = $mainMod, M,togglespecialworkspace, mixer

# Force killclose (Super + Shift + Q)
bind = SUPER SHIFT, Q, exec, kill -9 $(hyprctl activewindow -j | jq .pid)


$toggle_scroll = ~/.config/hypr/scripts/toggle_scroll.sh

# When Super is pressed, kill scroll sensitivity
bindnlt = , SUPER_L, exec, $toggle_scroll off
# When Super is released, restore it
bindrnlt = SUPER, SUPER_L, exec,$toggle_scroll on

$monitor_empty_ws = ~/.config/hypr/scripts/monitor_empty_ws.sh

# Move to new workspace
bind = $mainMod , X, exec, $monitor_empty_ws
# Move window to new workspace
bind = $mainMod ALT, X, exec, $monitor_empty_ws move

# Cycle active workspaces on the current monitor
unbind = $mainMod SHIFT, mouse_down
bind = $mainMod SHIFT, mouse_down, workspace, m-1
unbind = $mainMod SHIFT, mouse_up
bind = $mainMod SHIFT, mouse_up, workspace, m+1

$monitor_ws = ~/.config/hypr/scripts/monitor_ws.sh

# Cycle workspaces on the current monitor
unbind = $mainMod, mouse_down
bind = $mainMod, mouse_down, exec, $monitor_ws workspace -1
unbind = $mainMod, mouse_up
bind = $mainMod, mouse_up, exec, $monitor_ws workspace +1

# Cycle move windows on the current monitor
unbind = $mainMod ALT, mouse_down
bind = $mainMod ALT, mouse_down, exec, $monitor_ws movetoworkspace -1
unbind = $mainMod ALT, mouse_up
bind = $mainMod ALT, mouse_up, exec, $monitor_ws movetoworkspace +1


# Cycle workspaces on the current monitor
bind = $mainMod CTRL, left, exec, $monitor_ws workspace -1
bind = $mainMod CTRL, right, exec, $monitor_ws workspace +1



# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, $monitor_ws workspace 1
bind = $mainMod, 2, exec, $monitor_ws workspace 2
bind = $mainMod, 3, exec, $monitor_ws workspace 3
bind = $mainMod, 4, exec, $monitor_ws workspace 4
bind = $mainMod, 5, exec, $monitor_ws workspace 5
bind = $mainMod, 6, exec, $monitor_ws workspace 6
bind = $mainMod, 7, exec, $monitor_ws workspace 7
bind = $mainMod, 8, exec, $monitor_ws workspace 8
bind = $mainMod, 9, exec, $monitor_ws workspace 9
bind = $mainMod, 0, exec, $monitor_ws workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod ALT, 1, exec, $monitor_ws movetoworkspace 1
bind = $mainMod ALT, 2, exec, $monitor_ws movetoworkspace 2
bind = $mainMod ALT, 3, exec, $monitor_ws movetoworkspace 3
bind = $mainMod ALT, 4, exec, $monitor_ws movetoworkspace 4
bind = $mainMod ALT, 5, exec, $monitor_ws movetoworkspace 5
bind = $mainMod ALT, 6, exec, $monitor_ws movetoworkspace 6
bind = $mainMod ALT, 7, exec, $monitor_ws movetoworkspace 7
bind = $mainMod ALT, 8, exec, $monitor_ws movetoworkspace 8
bind = $mainMod ALT, 9, exec, $monitor_ws movetoworkspace 9
bind = $mainMod ALT, 0, exec, $monitor_ws movetoworkspace 10


plugin {
    hyprsplit {
        num_workspaces = 10 # Sets 10 workspaces for each monitor
    }
}

# Open btop in a kitty  window
unbind = CTRL SHIFT, Escape
bind = CTRL SHIFT, Escape, exec, kitty --class btop -e btop



