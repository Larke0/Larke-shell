# Open Clipboard History (Super + V)
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Screenshot with Swappy (No Flashbang)
# -b 1e1e2e80 : Dark background (Catppuccin Base) with 50% transparency
# -c b4befeff : Lavender border
# -w 2        : Border width of 2 pixels
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh

bind = ALT, TAB, cyclenext
