general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.config/quickshell/assets/wallpaper
    
    # Blur options
    blur_passes = 0
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25 
    dots_spacing = 0.15 
    dots_center = true
    dots_rounding = -1 
    
    # Outer Ring: Primary Color with 'ee' alpha (transparency)
    outer_color = rgba(bfc2ffee)
    
    # Inner Background: Surface Color (Solid)
    inner_color = rgba(131318ff)
    
    # Text Color: On Surface (Solid)
    font_color = rgba(e4e1e9ff)
    
    fade_on_empty = true
    fade_timeout = 1000 
    placeholder_text = <i>Input Password...</i> 
    hide_input = false
    rounding = -1 
    
    # Check Color: Tertiary (Solid)
    check_color = rgba(e8b9d4ff)
    
    # Fail Color: Error (Solid)
    fail_color = rgba(ffb4abff)
    
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> 
    fail_transition = 300 
    
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    # Clock
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    
    # Clock Color: On Surface (Solid)
    color = rgba(e4e1e9ff)
    
    font_size = 65
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}
