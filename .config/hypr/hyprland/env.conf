# You can put extra environment variables here
# https://wiki.hyprland.org/Configuring/Environment-variables/
# Environment Variables (For Hyprland and XWayland apps)

env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# GPU-specific drivers (LIBVA_DRIVER_NAME, VDPAU_DRIVER) live in
# custom/hyprland.conf because they vary per machine.

# GTK Settings (For apps like Files, Firefox, etc.)
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24


env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,gtk+
#env = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-sapphire-standard+default'
#env = GTK_THEME,catppuccin-mocha-sapphire-standard+default

env = QS_ICON_THEME,Papirus

env = MANGOHUD,1


env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
