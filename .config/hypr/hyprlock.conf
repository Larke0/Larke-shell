general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.config/hypr/assets/wallpaper
    
    # Blur options
    blur_passes = 1
    blur_size = 1
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.4
    dots_spacing = 0.15 
    dots_center = true
    dots_rounding = -1 
    
    # Outer Ring: Primary Color with 'ee' alpha (transparency)
    outer_color = rgba(ffb4a4ee)
    
    # Inner Background: Surface Color (Solid)
    inner_color = rgba(1a110fff)
    
    # Text Color: On Surface (Solid)
    font_color = rgba(f1dfdbff)
    
    fade_on_empty = true
    fade_timeout = 1000 
    placeholder_text = <i>Input Password...</i> 
    hide_input = false
    rounding = -1 
    
    # Check Color: Tertiary (Solid)
    check_color = rgba(dbc48cff)
    
    # Fail Color: Error (Solid)
    fail_color = rgba(ffb4abff)
    
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> 
    fail_transition = 300 
    
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    # Clock
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    
    # Clock Color: On Surface (Solid)
    color = rgba(f1dfdbff)
    
    font_size = 100
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}


