general {
    #lock_cmd = pidof hyprlock || hyprlock
    lock_cmd = caelestia shell lock lock
    # Add a 1-second delay so the screen renders before halting CPU
    before_sleep_cmd = loginctl lock-session && sleep 1
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240                    # 4 minutes
    on-timeout = notify-send -i "Hypridle" "You are idle!"
    #on-resume = notify-send -i "Hypridle" "Oh! you're Back" " Hello !!!"
}

# 1. LOCK FIRST (while screen is on)
listener {
    timeout = 300                    # 5 minutes
    on-timeout = loginctl lock-session
}

# 2. TURN OFF SCREEN SECOND
listener {
    timeout = 600                    # 10 minutes
    on-timeout = hyprctl dispatch dpms off  
    on-resume = hyprctl dispatch dpms on    
}

# 3. SUSPEND LAST
listener {
    timeout = 1800                   # 30 minutes
    #on-timeout = systemctl suspend
    #on-resume = notify-send -i  "Hypridle" "Oh! you're back" "Hello !!!"
}
