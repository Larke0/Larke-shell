# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:{{colors.outline.default.hex}}'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[ ](bold fg:{{colors.on_surface.default.hex}})"
error_symbol = "[ ](bold fg:{{colors.error.default.hex}})"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:{{colors.secondary_container.default.hex}}"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:{{colors.secondary_container.default.hex}})[$symbol $branch(:$remote_branch)](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})[ ](bold fg:{{colors.secondary_container.default.hex}})"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:{{colors.secondary_container.default.hex}} bold fg:{{colors.on_secondary_container.default.hex}})[](bold fg:{{colors.secondary_container.default.hex}})"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:{{colors.secondary_container.default.hex}} fg:{{colors.on_secondary_container.default.hex}}"
style_root = "red bold"
format = "[](bold fg:{{colors.secondary_container.default.hex}})[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:{{colors.primary_container.default.hex}})[󰉋 → $path]($style)[](bold fg:{{colors.primary_container.default.hex}})'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:{{colors.tertiary_container.default.hex}})[󰪢 $duration](bold bg:{{colors.tertiary_container.default.hex}} fg:{{colors.on_tertiary_container.default.hex}})[](bold fg:{{colors.tertiary_container.default.hex}})'

